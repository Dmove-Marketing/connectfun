# eventos.connectfun.com.br — trecho a aplicar no server block do nginx (VPS 157.173.197.116)
# Motivo: hoje qualquer endereço inexistente devolve a home com status 200. Com 10 URLs de
# campanha, um slug errado no anúncio levaria o lead para a home sem nenhum erro.
#
# 1) 404 de verdade: troque o fallback para a home (algo como `try_files $uri $uri/ /index.html;`)
#    por:

    root /var/www/eventos.connectfun.com.br;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

# 2) 301 dos slugs antigos da C1 (mudança de 03/10/2026). O site já tem páginas de
#    redirecionamento nesses endereços; o 301 no nginx é a versão definitiva e preserva
#    a query string (gclid/UTMs) via $is_args$args.

    location = /confraternizacao-empresa/casas-exclusivas/      { return 301 /confraternizacao-empresa/$is_args$args; }
    location = /confraternizacao-empresa/casas-exclusivas       { return 301 /confraternizacao-empresa/$is_args$args; }
    location = /confraternizacao-empresa/festa-de-fim-de-ano/   { return 301 /festa-fim-de-ano/$is_args$args; }
    location = /confraternizacao-empresa/festa-de-fim-de-ano    { return 301 /festa-fim-de-ano/$is_args$args; }
    location = /confraternizacao-empresa/happy-hour-corporativo/ { return 301 /happy-hour-corporativo/$is_args$args; }
    location = /confraternizacao-empresa/happy-hour-corporativo  { return 301 /happy-hour-corporativo/$is_args$args; }

# Depois de editar:  nginx -t && systemctl reload nginx
# Teste:
#   curl -sI https://eventos.connectfun.com.br/nao-existe/            -> HTTP/2 404
#   curl -sI https://eventos.connectfun.com.br/confraternizacao-empresa/festa-de-fim-de-ano/?gclid=x
#                                                                     -> 301, location: /festa-fim-de-ano/?gclid=x
#   curl -sI https://eventos.connectfun.com.br/festa-fim-de-ano/       -> HTTP/2 200
